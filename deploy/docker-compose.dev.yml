# Local development stack for Leo.
#
# Run from the repo root so relative paths and the root `.env` resolve correctly:
#   docker compose -f deploy/docker-compose.dev.yml --env-file .env up -d
# (the `make up` target wraps this exact invocation).
#
# NOTE: this file has been authored but NOT executed — Docker is not
# installed in the environment that produced it. `frontend/` does not exist
# yet either (separate implementation run); the `frontend` service below
# will fail to build until that code lands, which is expected for now.

name: leo-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leo}
      POSTGRES_DB: ${POSTGRES_DB:-leo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leo} -d ${POSTGRES_DB:-leo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-leo-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-leo-minio-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Override host-facing defaults from `.env` with in-network hostnames.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leo}:${POSTGRES_PASSWORD:-leo}@postgres:5432/${POSTGRES_DB:-leo}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # Development sends no real email by default. A Resend sandbox account
      # cannot send to anybody but its owner, nor from an unverified domain,
      # so registration - the one step that gates entry to the panel - fails
      # for every developer who is not Giannier. The console provider writes
      # the verification link to the log instead, and to the outbox file the
      # end-to-end suite reads. Set EMAIL_PROVIDER=resend in `.env` to
      # exercise the real thing.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      # Inside the bind mount, so the host (and Playwright) can read it.
      EMAIL_OUTBOX_PATH: /app/.tmp/outbox.jsonl
      # No credential, no network, no cost. The whole product is walkable
      # offline; every reply says so in its first line. Point LLM_PROFILE at a
      # real provider in `.env` to see real answers. `OfflineLLMProvider`
      # refuses to construct outside development, so this cannot reach a
      # deployment.
      LLM_PROFILE: ${LLM_PROFILE:-offline}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    # The ARQ worker. Same image as the API, different command.
    #
    # It was missing, and its absence is silent in the worst way: uploading a
    # PDF answers 202 and the source sits at `pending` for ever, which reads
    # as a broken product rather than as a component nobody started. The trial
    # crons - notifier, enforcer, archiver, wizard reminder - live here too,
    # so without it a trial never ends.
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.workers.settings.WorkerSettings"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leo}:${POSTGRES_PASSWORD:-leo}@postgres:5432/${POSTGRES_DB:-leo}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_OUTBOX_PATH: /app/.tmp/outbox.jsonl
      LLM_PROFILE: ${LLM_PROFILE:-offline}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Hot reload over a bind mount from a Windows or macOS host: the file
      # change happens outside the container's filesystem, so inotify never
      # fires and the dev server keeps serving stale output. Polling costs a
      # little CPU and is the difference between edits appearing and a
      # confusing hour spent wondering why they do not.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      # `.next` stays inside the container. Bind-mounting it means the host
      # and the container fight over the same build directory: run
      # `npm run build` on your machine while this is up and the dev server
      # starts serving a production manifest it cannot find, which surfaces
      # as a wall of ENOENT on `_buildManifest.js.tmp` and a 500 on every
      # page. Named volume, so each side keeps its own.
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  frontend_next:
