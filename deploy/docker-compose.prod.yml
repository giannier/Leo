# Production stack for Leo (TASK-026). One VPS (Contabo), one domain.
#
#   cp deploy/env.prod.example deploy/.env.prod   # fill it in, chmod 600
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Caddy is the only service with public ports: it gets the HTTPS certificates
# by itself (Let's Encrypt) and sends `/api` and `/webhooks` to the backend and
# everything else to the frontend. Files (photos, receipts, documents) live in
# Postgres and are served by the API through short-lived signed links, so there
# is no object store to run. Postgres and Redis are reachable only inside the
# compose network. The runbook is deploy/RUNBOOK.md.

name: leo

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  # Files in Postgres. Links to them are built on the site's own address, which
  # is also what WhatsApp downloads media from.
  STORAGE_BACKEND: postgres
  API_PUBLIC_BASE_URL: https://${LEO_DOMAIN}
  FRONTEND_BASE_URL: https://${LEO_DOMAIN}
  CORS_ORIGINS: https://${LEO_DOMAIN}
  # Caddy is in front: the client's address comes in X-Forwarded-For.
  TRUST_PROXY_HEADERS: "true"

x-backend: &backend
  build:
    context: ../backend
    dockerfile: ../deploy/Dockerfile
    target: prod
  image: leo-backend:latest
  restart: unless-stopped
  env_file:
    - .env.prod
  environment:
    <<: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LEO_DOMAIN: ${LEO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only: the ARQ queue and the debounce of incoming messages survive
    # a restart of the container.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Migrations first, once per deploy; the API and the worker wait for it.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # The ARQ worker: knowledge indexing, the outbox of WhatsApp messages,
  # follow-ups, billing and metrics jobs, trial crons. Without it nothing
  # scheduled happens.
  worker:
    <<: *backend
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: https://${LEO_DOMAIN}
    image: leo-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  # Optional: an uptime monitor at status.<domain>. Start it with
  #   docker compose ... --profile monitoring up -d
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.15
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  uptime_kuma_data:
