[project]
name = "leo-backend"
version = "0.1.0"
description = "Leo AaaS backend — multi-tenant WhatsApp AI agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyjwt>=2.9",
  "passlib[argon2]>=1.7",
  "boto3>=1.35",
  "arq>=0.26",
  # Fernet, for encrypting per-tenant provider credentials at rest.
  # Pre-approved in plan.md's Decisiones Tecnicas table.
  "cryptography>=43.0",
  # Runtime HTTP client for the provider adapters. Previously a dev-only
  # dependency (test client); promoted here because app code now depends on
  # it. No new package enters the lockfile.
  "httpx>=0.27",
  # PDF text extraction for the RAG ingestion worker (TASK-012).
  # PENDING GIANNIER'S EXPLICIT APPROVAL - the Constitution requires it for
  # every new dependency. Named in plan.md's "Dependencias Nuevas" table and
  # approved by Giannier on 2026-07-31.
  # Pure Python, zero runtime dependencies, MIT/BSD. Confined to
  # `app/providers/pdf/` behind the `PdfTextExtractor` port.
  "pypdf>=5.1",
  # Required by Starlette/FastAPI to parse `multipart/form-data`, which the
  # API contract mandates for the PDF upload (and TASK-011's CSV import).
  # Not in plan.md; approved by Giannier on 2026-07-31 as non-optional -
  # Starlette cannot parse the upload the contract requires without it. Pure
  # Python, no dependencies; the parser FastAPI itself documents for `UploadFile`.
  "python-multipart>=0.0.9",
  # XLSX import. Not in plan.md - which says "Import CSV" where
  # contracts/api.md says "CSV/XLSX" - approved by Giannier on 2026-07-31 to
  # settle that in favour of the contract. Pure Python, reads the sheet in
  # read-only streaming mode so a large workbook is not held in memory.
  "openpyxl>=3.1",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "coverage>=7.6",
  # Property-based tests for money (009 billing: proration to the cent).
  # Approved by Giannier on 2026-10-14. Test-only, never imported by `app/`.
  "hypothesis>=6.100",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates one long line per column. Re-wrapping generated DDL by
# hand on every migration invites transcription errors in exactly the place you
# least want them, so line length is not enforced there. Every other rule is.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
[[tool.mypy.overrides]]
# boto3, botocore and openpyxl ship no type information. Ignoring their imports is
# narrower than loosening strictness globally; app code that uses them is
# still fully checked.
module = ["boto3.*", "botocore.*", "openpyxl.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
# passlib 1.7 predates PEP 561 and ships no `py.typed`. Confined to
# `app/core/security.py`, which annotates every value it gets back so the
# `Any` does not escape into the rest of the codebase.
module = ["passlib.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra -m 'not slow and not evals'"
markers = [
  "slow: hits a real third-party provider over the network; excluded by default",
  "evals: golden agent conversations against a real model; run with `make evals`",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# The floor for the codebase as a whole. It is deliberately the *baseline*
# number from `constitution.md`, not the critical one: a single global gate
# cannot say "80% on agent-core, 70% on the rest", and set to 80 it would
# either fail honest code or, set to 70, quietly permit an untested agent.
#
# `scripts/coverage_gate.py` is what enforces the standard per module group,
# and `make coverage` runs both. This value only guarantees that a collapse
# in overall coverage cannot pass unnoticed.
fail_under = 70
