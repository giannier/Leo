[project]
name = "leo-backend"
version = "0.1.0"
description = "Leo AaaS backend — multi-tenant WhatsApp AI agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyjwt>=2.9",
  "passlib[argon2]>=1.7",
  "boto3>=1.35",
  "arq>=0.26",
  # Fernet, for encrypting per-tenant provider credentials at rest.
  # Pre-approved in plan.md's Decisiones Tecnicas table.
  "cryptography>=43.0",
  # Runtime HTTP client for the provider adapters. Previously a dev-only
  # dependency (test client); promoted here because app code now depends on
  # it. No new package enters the lockfile.
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "coverage>=7.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates one long line per column. Re-wrapping generated DDL by
# hand on every migration invites transcription errors in exactly the place you
# least want them, so line length is not enforced there. Every other rule is.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
[[tool.mypy.overrides]]
# boto3 and botocore ship no type information. Ignoring their imports is
# narrower than loosening strictness globally; app code that uses them is
# still fully checked.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra -m 'not slow'"
markers = [
  "slow: hits a real third-party provider over the network; excluded by default",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
